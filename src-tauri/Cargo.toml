[package]
name = "quickapp-desktop"
version = "0.1.2"
description = "快应用桌面运行时 (Tauri v2)"
authors = ["chendd"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
# 抖音播放列表通道加密会话（对齐 dlna_demo SessionCrypto：X25519 协商 + AES-128-GCM）
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
socket2 = "0.5"
url = "2"
chrono = "0.4"

[features]
# 默认关闭自定义-protocol，开发态用 devUrl(http) 即可
default = ["devtools"]
# devtools（审查元素）仅开发态需要；发布构建用 --no-default-features 排除，
# 使 release 二进制不含 webview devtools 能力，从根上屏蔽"审查元素/检查"。
devtools = ["tauri/devtools"]
