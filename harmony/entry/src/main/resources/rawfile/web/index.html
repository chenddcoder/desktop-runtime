      var container = document.getElementById('main-container');
      if (container) {
        container.style.setProperty('width', TV_WIDTH + 'px');
        container.style.setProperty('height', TV_HEIGHT + 'px');

        // 竖屏设备需要旋转90度
        if (_isPortraitDevice) {
          // 竖屏时，旋转后容器的"视觉尺寸"是 TV_HEIGHT x TV_WIDTH
          var rotatedWidth = TV_HEIGHT;
          var rotatedHeight = TV_WIDTH;

          // 计算缩放比例
          var scaleX = _originalInnerWidth / rotatedWidth;
          var scaleY = _originalInnerHeight / rotatedHeight;
          var scale = Math.min(scaleX, scaleY);

          // 计算缩放后的尺寸
          var scaledRotatedWidth = rotatedWidth * scale;
          var scaledRotatedHeight = rotatedHeight * scale;

          // 计算居中偏移
          var offsetX = (_originalInnerWidth - scaledRotatedWidth) / 2;
          var offsetY = (_originalInnerHeight - scaledRotatedHeight) / 2;

          // 设置 transform: 旋转90度并缩放
          container.style.transformOrigin = 'center center';
          container.style.transform = 'rotate(90deg) scale(' + scale + ')';

          // 居中定位：容器中心对齐到屏幕中心
          // 容器原始尺寸 TV_WIDTH x TV_HEIGHT，中心在 (TV_WIDTH/2, TV_HEIGHT/2)
          // 旋转后，需要将中心移动到屏幕中心
          container.style.left = '0';
          container.style.top = '0';
          container.style.marginLeft = (offsetX + scaledRotatedWidth / 2 - TV_WIDTH / 2) + 'px';
          container.style.marginTop = (offsetY + scaledRotatedHeight / 2 - TV_HEIGHT / 2) + 'px';

          // Show the container after positioning
          container.style.visibility = 'visible';

          console.log('[scaleApp] Portrait mode - rotated 90°, scale:', scale.toFixed(3),
                      'offset:', offsetX.toFixed(1), offsetY.toFixed(1));
        } else {
          // 横屏设备，正常缩放
          var scaleX = _originalInnerWidth / TV_WIDTH;
          var scaleY = _originalInnerHeight / TV_HEIGHT;
          var scale = Math.min(scaleX, scaleY);
          container.style.transformOrigin = 'top left';
          container.style.transform = 'scale(' + scale + ')';
          var offsetX = (_originalInnerWidth - TV_WIDTH * scale) / 2;
          var offsetY = (_originalInnerHeight - TV_HEIGHT * scale) / 2;
          container.style.left = '0';
          container.style.top = '0';
          container.style.marginLeft = offsetX + 'px';
          container.style.marginTop = offsetY + 'px';

          // Show the container after positioning
          container.style.visibility = 'visible';
        }
      }
    }
    
    // Execute immediately when DOM is ready (before load event)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', scaleApp);
    } else {

    }

        updateOrientationIndicator();
      }
      scaleApp();
    });

        console.log('[Orientation] Screen orientation event:', screen.orientation.type);

          window.__IS_PORTRAIT_DEVICE__ = _isPortraitDevice;
          updateOrientationIndicator();
          scaleApp();
        }
      });
    }

    function updateOrientationIndicator() {

      if (indicator) {
        if (_isPortraitDevice) {

        } else {
          indicator.textContent = '横屏';
          indicator.style.color = '#4CAF50';

    }

    function loadBundle(bundlePath) {

      url.searchParams.set('bundle', bundlePath);
      url.searchParams.delete('zip');  // 清除 zip 参数
      window.location.href = url.toString();
    }</script></head><body><div id="main-container"><div class="controls" id="controls-panel"><div class="title"><span>Web Runtime</span> <button class="controls-toggle" onclick="toggleControls()" title="最小化/展开"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></button></div><div class="controls-content"><div class="info" id="bundle-info">Loading runtime...</div><div style="margin: 4px 0; font-size: 11px;"><span style="color: #888;">方向:</span> <span id="orientation-indicator" style="margin-left: 4px;">检测中...</span></div><div class="upload-section" style="margin: 8px 0; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.1);"><input type="file" id="zip-upload" accept=".zip" style="display: none;"/> <button onclick="document.getElementById('zip-upload').click()">上传 ZIP 包</button> <button onclick="clearZipCache()" title="清除ZIP缓存">清除</button> <span id="zip-filename" style="margin-left: 8px; color: #888; font-size: 11px;"></span></div><div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: 4px;"><div style="margin-bottom: 6px; color: #888; font-size: 11px;">或输入 ZIP 包 URL：</div><div style="display: flex; gap: 4px;"><input id="zip-url-input" placeholder="https://example.com/bundle.zip" style="flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px 8px; color: #fff; font-size: 11px; font-family: inherit;"/> <button onclick="loadZipFromUrl()" style="white-space: nowrap;">加载</button></div></div><div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; margin-top: 4px;"><button onclick="forceReloadZip()" title="强制重新下载ZIP包" style="background: #FF9800;">强制刷新</button></div></div></div><div id="drop-zone"><div class="drop-icon">📁</div><div class="drop-text">释放以加载文件</div><div class="drop-hint">支持 ZIP 文件或包含 index.bundle 的目录</div></div><button id="web-back-btn" title="返回"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button><div id="loading-overlay"><div class="loading-content"><div class="loading-title">正在加载应用</div><div class="loading-bar-container"><div class="loading-bar" id="loading-bar"></div></div><div class="loading-percent" id="loading-percent">0%</div><div class="loading-status" id="loading-status">准备中...</div></div></div><div id="quickapp-splash"><img class="splash-icon" id="splash-icon" alt=""/><div class="splash-name" id="splash-name"></div><div class="splash-progress"><div class="splash-progress-thumb" id="splash-thumb"></div></div></div><div id="app"></div></div><script>// 加载进度条控制函数
    function showLoadingOverlay() {
      var overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.add('active');
      }
    }
    function hideLoadingOverlay() {
      var overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.remove('active');
      }
    }
    function updateLoadingProgress(percent, status) {
      var bar = document.getElementById('loading-bar');
      var percentEl = document.getElementById('loading-percent');
      var statusEl = document.getElementById('loading-status');
      if (bar) {
        bar.style.width = percent + '%';
      }
      if (percentEl) {
        percentEl.textContent = Math.round(percent) + '%';
      }
      if (statusEl && status) {
        statusEl.textContent = status;
      }
    }

      show: showLoadingOverlay,

    // 快应用加载 splash（#quickapp-splash）的 DOM 控制由 loader.js 入口处

    // window.__QUICKAPP_SPLASH__，此处不再重复定义。

      if (panel) {
        // URL 参数优先：?controls=0 强制最小化，?controls=1 强制展开，缺省沿用 localStorage。
        // 宿主页面需要它：快应用门户把运行时嵌在 iframe 里时，若不最小化，
        // 「上传 ZIP 包 / 强制刷新」这块调试面板会直接盖住应用画面。

          forced = new URLSearchParams(window.location.search).get('controls');
        } catch (e) {}
        var isMinimized;
        if (forced === '0') {
          isMinimized = true;
        } else if (forced === '1') {
          isMinimized = false;
        } else {
          isMinimized = localStorage.getItem('controls-minimized') === 'true';
        }
        if (isMinimized) {
          panel.classList.add('minimized');
        }
      }
    })();

    // 控制面板最小化/展开
    function toggleControls() {
      var panel = document.getElementById('controls-panel');
      if (panel) {
        panel.classList.toggle('minimized');
        // 保存状态到 localStorage
        var isMinimized = panel.classList.contains('minimized');
        localStorage.setItem('controls-minimized', isMinimized.toString());
      }
    }

    // 返回按钮点击事件

    });

    // ZIP 上传处理
    document.getElementById('zip-upload').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      
      document.getElementById('zip-filename').textContent = file.name;
      document.getElementById('bundle-info').textContent = '正在解压 ' + file.name + '...';

    // 清除 ZIP 缓存
    function clearZipCache() {
      var request = indexedDB.deleteDatabase('quicktvui-zip-cache');
      request.onsuccess = function() {
        console.log('ZIP cache cleared');
        // 移除 zip 参数并刷新
        var url = new URL(window.location.href);
        url.searchParams.delete('zip');
        window.location.href = url.toString();
      };
      request.onerror = function(e) {
        console.error('Failed to clear cache:', e);
      };
    }

    // 强制刷新 ZIP（清除缓存并重新下载）
    function forceReloadZip() {
      var url = new URL(window.location.href);
      var zipUrl = url.searchParams.get('zipUrl');
      
      if (zipUrl) {
        console.log('Force reload triggered');
        // 先添加 _force 参数并跳转
        // loader.js 会在加载前清除 IndexedDB 缓存
        url.searchParams.set('_force', Date.now().toString());
        window.location.href = url.toString();
      } else {
        alert('当前不是从 ZIP URL 加载的');
      }
    }

    // 从 URL 加载 ZIP 包
    function loadZipFromUrl() {
      var input = document.getElementById('zip-url-input');
      var zipUrl = input.value.trim();
      if (!zipUrl) {
        alert('请输入 ZIP 包 URL');
        return;
      }

      // 验证 URL 格式
      try {
        new URL(zipUrl);
      } catch (e) {
        alert('请输入有效的 URL');
        return;
      }

      // 跳转到带 zipUrl 参数的页面
      var url = new URL(window.location.href);
      url.searchParams.set('zipUrl', zipUrl);
      url.searchParams.delete('zip');
      url.searchParams.delete('bundle');
      window.location.href = url.toString();
    }

    // 支持回车键加载
    document.getElementById('zip-url-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        loadZipFromUrl();
      }
    });

    // ========== 拖拽上传功能 ==========
    var dropZone = document.getElementById('drop-zone');
    var dragCounter = 0;

    // 阻止默认行为
    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    // 拖拽进入
    document.addEventListener('dragenter', function(e) {
      preventDefaults(e);
      dragCounter++;
      if (dragCounter === 1) {
        dropZone.classList.add('active');
      }
    });

    // 拖拽离开
    document.addEventListener('dragleave', function(e) {
      preventDefaults(e);
      dragCounter--;
      if (dragCounter === 0) {
        dropZone.classList.remove('active');
      }
    });

    // 拖拽悬停
    document.addEventListener('dragover', function(e) {
      preventDefaults(e);
    });

    // 释放文件
    document.addEventListener('drop', function(e) {
      preventDefaults(e);
      dragCounter = 0;
      dropZone.classList.remove('active');

      var items = e.dataTransfer.items;
      if (!items || items.length === 0) return;

      var item = items[0];
      var entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;

      if (entry) {
        if (entry.isFile) {
          // 单个文件
          entry.file(function(file) {
            if (file.name.endsWith('.zip')) {
              handleDroppedFile(file);
            } else {
              alert('请拖拽 ZIP 文件或包含 index.android.js 的目录');
            }
          });
        } else if (entry.isDirectory) {
          // 目录
          handleDroppedDirectory(entry);
        }
      } else {
        // 降级处理
        var file = e.dataTransfer.files[0];
        if (file && file.name.endsWith('.zip')) {
          handleDroppedFile(file);
        }
      }
    });

    // 处理拖拽的 ZIP 文件
    function handleDroppedFile(file) {
      document.getElementById('zip-filename').textContent = file.name;
      document.getElementById('bundle-info').textContent = '正在解压 ' + file.name + '...';
      
      window.dispatchEvent(new CustomEvent('zip-file-selected', { 
        detail: { file: file, name: file.name } 
      }));
    }

    // 处理拖拽的目录
    function handleDroppedDirectory(dirEntry) {
      document.getElementById('bundle-info').textContent = '正在读取目录...';
      
      var files = {};
      var fileCount = 0;
      var totalFiles = 0;

      // 递归读取目录
      function readDirectory(entry, path) {
        return new Promise(function(resolve, reject) {
          if (entry.isFile) {
            entry.file(function(file) {
              var reader = new FileReader();
              reader.onload = function(e) {
                var content = e.target.result;
                // 转为 base64
                var binary = '';
                var bytes = new Uint8Array(content);
                for (var i = 0; i < bytes.length; i++) {
                  binary += String.fromCharCode(bytes[i]);
                }
                files[path] = btoa(binary);
                fileCount++;
                resolve();
              };
              reader.onerror = function(err) {
                console.error('[Drop] Failed to read file:', path, err);
                reject(err);
              };
              reader.readAsArrayBuffer(file);
            }, function(err) {
              console.error('[Drop] Failed to get file:', path, err);
              reject(err);
            });
          } else if (entry.isDirectory) {
            var reader = entry.createReader();
            var allEntries = [];
            
            // readEntries 可能需要多次调用才能读取所有条目
            function readAllEntries() {
              reader.readEntries(function(entries) {
                if (entries.length === 0) {
                  // 所有条目已读取完毕
                  var promises = [];
                  allEntries.forEach(function(childEntry) {
                    var childPath = path ? path + '/' + childEntry.name : childEntry.name;
                    promises.push(readDirectory(childEntry, childPath));
                  });
                  Promise.all(promises).then(resolve).catch(reject);
                } else {
                  // 还有更多条目，继续读取
                  allEntries = allEntries.concat(entries);
                  readAllEntries();
                }
              }, function(err) {
                console.error('[Drop] Failed to read directory:', path, err);
                reject(err);
              });
            }
            
            readAllEntries();
          }
        });
      }

      // 过滤无效文件
      function isValidFile(path) {
        if (path.includes('__MACOSX/')) return false;
        if (path.split('/').pop().startsWith('._')) return false;
        if (path.endsWith('.DS_Store')) return false;
        return true;
      }

      readDirectory(dirEntry, '').then(function() {
        console.log('[Drop] Directory read:', fileCount, 'files');
        console.log('[Drop] All file paths:', Object.keys(files));
        console.log('[Drop] File paths sample:', Object.keys(files).slice(0, 5));

        var filteredFiles = {};
        Object.keys(files).forEach(function(path) {
          if (isValidFile(path)) {
            filteredFiles[path] = files[path];
          } else {
            console.log('[Drop] Filtered out:', path);
          }
        });

        console.log('[Drop] Filtered files count:', Object.keys(filteredFiles).length);
        console.log('[Drop] Filtered files sample:', Object.keys(filteredFiles).slice(0, 10));

        var fileList = Object.keys(filteredFiles);
        var entryFile = fileList.find(function(f) { return f.endsWith('index.bundle'); });
        if (!entryFile) entryFile = fileList.find(function(f) { return f.endsWith('index.android.js'); });
        if (!entryFile) entryFile = fileList.find(function(f) { return f.match(/index\.(android|hippy)\.js$/); });
        if (!entryFile) entryFile = fileList.find(function(f) { return f.endsWith('.bundle'); });
        if (!entryFile) entryFile = fileList.find(function(f) { return f.endsWith('.js'); });

        if (!entryFile) {
          alert('目录中未找到 index.bundle 或有效的 bundle 文件');
          document.getElementById('bundle-info').textContent = '未找到有效入口文件';
          return;
        }

        console.log('[Drop] Entry file:', entryFile);
        console.log('[Drop] Entry file will set baseDir to:', entryFile.substring(0, entryFile.lastIndexOf('/')));
        document.getElementById('zip-filename').textContent = dirEntry.name;
        document.getElementById('bundle-info').textContent = '已加载: ' + entryFile;

        window.dispatchEvent(new CustomEvent('directory-dropped', { 
          detail: { 
            files: filteredFiles, 
            entryFile: entryFile, 
            name: dirEntry.name 
          } 
        }));
      }).catch(function(err) {
        console.error('[Drop] Failed to read directory:', err);
        alert('读取目录失败: ' + err.message);
        document.getElementById('bundle-info').textContent = '读取目录失败';
      });
    }</script><script src="web-runtime.3a96f497b188aea91f41.js"></script></body></html>
